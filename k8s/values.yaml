# Harness resolves the <+...> expressions before rendering the Go templates.
name: springboot-harness-demo
namespace: <+infra.namespace>
image: <+artifacts.primary.image>
version: <+artifacts.primary.tag>
environment: <+env.identifier>
replicas: 2
# ClusterIP: tests reach QA via cluster DNS; use `kubectl port-forward` to open it locally.
# (On Docker Desktop, two LoadBalancer services would both try to bind localhost:80.)
serviceType: ClusterIP
